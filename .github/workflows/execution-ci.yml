name: Nexis Execution CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'execution-service/**'
      - '.github/workflows/execution-ci.yml'
  pull_request:
    branches: [ "main" ]

jobs:
  execution-service-tests:
    name: Build & Test Execution Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Integration Tests (with Testcontainers)
        working-directory: ./execution-service
        run: ./mvnw clean test