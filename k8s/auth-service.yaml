apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nexis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: krishnaagarwal10/nexis-auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        # --- DISABLE EUREKA ---
        - name: EUREKA_CLIENT_ENABLED
          value: "false"
        - name: EUREKA_CLIENT_FETCH_REGISTRY
          value: "false"
        - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
          value: "false"

        # --- DATABASE INJECTION ---
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://auth-db-service:5432/auth-db"
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: database.password

        # --- REDIS INJECTION ---
        - name: SPRING_DATA_REDIS_HOST
          value: "nexis-redis-service"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: redis.password

        # --- APP SECRETS INJECTION ---
        - name: JWT_SECRETKEY
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: jwt.secret

          # --- MAIL SECRETS INJECTION (FORCED VIA K8S) ---
        - name: SPRING_MAIL_HOST
          value: "smtp.gmail.com"
        - name: SPRING_MAIL_PORT
          value: "587"
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
          value: "true"
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
          value: "true"
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: mail.username
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: mail.password

          # --- OAUTH SECRETS INJECTION ---
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: oauth.google.client.id
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: oauth.google.client.secret
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: oauth.github.client.id
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: oauth.github.client.secret
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nexis
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
